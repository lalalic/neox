name: Neox
options:
  bundleIdPrefix: com.neox
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

packages:
  copilot-ios:
    path: copilot-ios

targets:
  Neox:
    type: application
    platform: iOS
    sources:
      - Neox
      - path: Neox/Resources/wechat-bro.js
        type: file
        buildPhase: resources
    entitlements:
      path: Neox/Neox.entitlements
    preBuildScripts:
      - name: Rebuild workspace.zip
        script: |
          cd "${PROJECT_DIR}/workspace"
          zip -r "${PROJECT_DIR}/copilot-ios/CopilotSDK/Sources/Resources/workspace.zip" . -x "*.DS_Store" > /dev/null 2>&1
          echo "workspace.zip rebuilt from neox/workspace"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neox.app
        INFOPLIST_FILE: Neox/Info.plist
        CODE_SIGN_ENTITLEMENTS: Neox/Neox.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "JABNLDLN8G"
    dependencies:
      - package: copilot-ios
        product: NeoxCore
      - package: copilot-ios
        product: CopilotSDK
      - package: copilot-ios
        product: CopilotChat
      - package: copilot-ios
        product: WebKitAgent
      - package: copilot-ios
        product: AppAgent
      - package: copilot-ios
        product: CameraKit

  NeoxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NeoxTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neox.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Neox
      - package: copilot-ios
        product: CopilotSDK
      - package: copilot-ios
        product: CopilotChat
      - package: copilot-ios
        product: WebKitAgent
