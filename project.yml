name: Neox
options:
  bundleIdPrefix: com.neox
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

targets:
  NeoxApp:
    type: application
    platform: iOS
    sources:
      - Neox/App
      - Neox/Server
      - Neox/Intents
      - Neox/AgentKit
      - Neox/Assets.xcassets
    entitlements:
      path: Neox/Neox.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neox.app
        PRODUCT_NAME: Neox
        PRODUCT_MODULE_NAME: NeoxApp
        INFOPLIST_FILE: Neox/Info.plist
        CODE_SIGN_ENTITLEMENTS: Neox/Neox.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "JABNLDLN8G"
        PROVISIONING_PROFILE_SPECIFIER: PhoneBridge-Dev
        CODE_SIGN_STYLE: Manual
schemes:
  NeoxApp:
    build:
      targets:
        NeoxApp: all
    run:
      config: Debug
    archive:
      config: Release
