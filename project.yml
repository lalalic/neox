name: PhoneBridge
options:
  bundleIdPrefix: com.neox
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

packages:
  copilot-ios:
    path: copilot-ios

targets:
  PhoneBridgeApp:
    type: application
    platform: iOS
    sources:
      - Neox
    entitlements:
      path: Neox/Neox.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neox.app
        PRODUCT_NAME: PhoneBridge
        PRODUCT_MODULE_NAME: PhoneBridgeApp
        INFOPLIST_FILE: Neox/Info.plist
        CODE_SIGN_ENTITLEMENTS: Neox/Neox.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "JABNLDLN8G"
    dependencies:
      - package: copilot-ios
        product: AppAgent
      - package: copilot-ios
        product: PhoneBridge

schemes:
  PhoneBridgeApp:
    build:
      targets:
        PhoneBridgeApp: all
    run:
      config: Debug
    archive:
      config: Release
