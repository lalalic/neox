name: NeoxTourMac
options:
  bundleIdPrefix: com.neox
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  NeoxTourMac:
    type: application
    platform: macOS
    sources:
      - Sources/NeoxTourMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neox.tour.mac
        PRODUCT_NAME: Neox Tour
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: Resources/NeoxTourMac.entitlements

schemes:
  NeoxTourMac:
    build:
      targets:
        NeoxTourMac: all
    run:
      config: Debug
