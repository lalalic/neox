[package]
name = "neoy-file-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Private read-only mounted file server behind NeoY Swift gateway"

[dependencies]
actix-web = "=4.12.1"
actix-files = "=0.6.9"
cap-std = "=3.4.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
mime = "=0.3.17"
percent-encoding = "=2.3.2"
libc = "=0.2.191"

[dev-dependencies]
tempfile = "=3.23.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
