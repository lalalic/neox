name: NeoY
options:
  bundleIdPrefix: com.neox
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  NeoY:
    type: application
    platform: macOS
    sources:
      - Sources/NeoY
      - path: Resources/Scripts/neo-node/bootstrap-mac-node.sh
        buildPhase: resources
      - path: Resources/Scripts/neo-node/mac-node-server.py
        buildPhase: resources
    resources:
      - Resources/Scripts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neox.neoy
        PRODUCT_NAME: NeoY
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: Resources/NeoY.entitlements

  NeoYTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/NeoYTests
    dependencies:
      - target: NeoY
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neox.neoy.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NeoY:
    build:
      targets:
        NeoY: all
        NeoYTests: [test]
    run:
      config: Debug
    test:
      targets:
        - NeoYTests
