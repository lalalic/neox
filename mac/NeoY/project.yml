name: NeoY
options:
  bundleIdPrefix: com.neox
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  NeoY:
    type: application
    platform: macOS
    sources:
      - Sources/NeoY
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neox.neoy
        PRODUCT_NAME: NeoY
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: Resources/NeoY.entitlements

schemes:
  NeoY:
    build:
      targets:
        NeoY: all
    run:
      config: Debug
