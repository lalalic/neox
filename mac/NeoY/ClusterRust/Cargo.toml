[package]
name = "neo-cluster-rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native macOS remote node MCP runtime and SSH supervisor for NeoY cluster"

[dependencies]
actix-web = "=4.12.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "1", features = ["full"] }
libc = "=0.2.191"

[dev-dependencies]
tempfile = "=3.23.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
